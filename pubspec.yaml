name: tajik_read
description: Offline Tajik Cyrillic speed-reading MVP.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.1.2
  image: ^4.2.0
  flutter_svg: ^2.0.10+1
  path_provider: ^2.1.4
  tesseract_ocr:
    git:
      url: https://github.com/arrrrny/tesseract_ocr.git
      ref: f0d149d54df2b6cc77351979e7d2ced5b7b27358

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/tezhon_symbol.svg
    - assets/tessdata_config.json
    - assets/tessdata/
