name: Build Tajik Read APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android,ios .

      - name: Download Tajik OCR model
        run: |
          mkdir -p assets/tessdata
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/tgk.traineddata \
            -o assets/tessdata/tgk.traineddata
          test -s assets/tessdata/tgk.traineddata

      - name: Install dependencies
        run: flutter pub get

      - name: Remove default Flutter test
        run: rm -f test/widget_test.dart

      - name: Run tests
        run: flutter test

      - name: Work around image_picker Android Lint crash
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/disable-release-lint.gradle <<'EOF'
          gradle.projectsEvaluated {
            allprojects {
              if (project.name == 'image_picker_android') {
                tasks.matching {
                  it.name == 'lintVitalAnalyzeRelease' ||
                  it.name == 'lintAnalyzeRelease'
                }.configureEach {
                  enabled = false
                }
              }
            }
          }
          EOF

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tajik-read-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
